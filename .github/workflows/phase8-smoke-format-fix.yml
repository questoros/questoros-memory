name: Phase 8 smoke format fix

on:
  push:
    branches:
      - feat/phase-8-remote-mcp-demo
    paths:
      - 'services/mcp-server/scripts/phase8-remote-staging-smoke.mjs'
      - 'services/mcp-server/package.json'
      - '.github/workflows/phase8-smoke-format-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phase-8-remote-mcp-demo
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Auto-fix smoke script
        run: |
          pnpm exec eslint services/mcp-server/scripts/phase8-remote-staging-smoke.mjs --fix
          pnpm exec prettier --write services/mcp-server/scripts/phase8-remote-staging-smoke.mjs services/mcp-server/package.json
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No auto-fix changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mcp-server/scripts/phase8-remote-staging-smoke.mjs services/mcp-server/package.json
          git commit -m 'fix(phase8): auto-fix remote MCP smoke lint'
          git push origin HEAD:feat/phase-8-remote-mcp-demo
