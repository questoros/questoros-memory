name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @questoros-memory/database prisma:generate

      - name: Build packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Format check
        run: pnpm format:check

      - name: Capture product diagnostics
        run: |
          set +e
          pnpm lint > lint.log 2>&1
          echo "lint_exit=$?" >> diagnostics-summary.txt
          pnpm typecheck > typecheck.log 2>&1
          echo "typecheck_exit=$?" >> diagnostics-summary.txt
          pnpm test > test.log 2>&1
          echo "test_exit=$?" >> diagnostics-summary.txt
          pnpm build > build.log 2>&1
          echo "build_exit=$?" >> diagnostics-summary.txt
          pnpm --filter @questoros-memory/aws-cdk synth > synth.log 2>&1
          echo "synth_exit=$?" >> diagnostics-summary.txt
          set -e

      - name: Upload product diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: product-quality-diagnostics
          path: |
            diagnostics-summary.txt
            lint.log
            typecheck.log
            test.log
            build.log
            synth.log
          if-no-files-found: error
          retention-days: 1
