name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @questoros-memory/database prisma:generate

      - name: Build packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Synthesize and verify AWS staging package
        run: pnpm --filter @questoros-memory/aws-cdk synth
