name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  phase7-format-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase-7-live-bedrock-reasoning'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase-7-live-bedrock-reasoning

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm exec prettier --write .

      - name: Commit formatting when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(reasoning): apply final Phase 7 formatting"
          git push origin HEAD:feat/phase-7-live-bedrock-reasoning

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @questoros-memory/database prisma:generate

      - name: Build packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Synthesize and verify AWS staging package
        run: pnpm --filter @questoros-memory/aws-cdk synth
