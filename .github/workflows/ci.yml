name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @questoros-memory/database prisma:generate

      - name: Build packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Format product branch
        if: github.head_ref == 'feat/memoryos-finished-product' || github.ref_name == 'feat/memoryos-finished-product'
        run: pnpm exec prettier --write .

      - name: Commit formatter output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/memoryos-finished-product'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/ci.yml
          git add \
            apps/web/public/index.html \
            apps/web/public/styles.css \
            apps/web/scripts/serve.mjs \
            apps/web/src/api.ts \
            apps/web/src/format.ts \
            apps/web/src/index.ts \
            apps/web/src/types.ts \
            apps/web/vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "style(product): format MemoryOS client portal"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Synthesize and verify AWS staging package
        run: pnpm --filter @questoros-memory/aws-cdk synth
