name: Phase 7 key format helper

on:
  pull_request:
    paths:
      - 'packages/database/scripts/upgrade-phase7-key-permissions.ts'
      - 'packages/database/scripts/bootstrap-local-auth.ts'
      - '.github/workflows/phase7-key-format-helper.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format permission scripts
        run: pnpm exec prettier --write packages/database/scripts/upgrade-phase7-key-permissions.ts packages/database/scripts/bootstrap-local-auth.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase7-key-formatted
          path: |
            packages/database/scripts/upgrade-phase7-key-permissions.ts
            packages/database/scripts/bootstrap-local-auth.ts
          if-no-files-found: error
          retention-days: 1
