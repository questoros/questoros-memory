name: Phase 8B format debug

on:
  pull_request:
    paths:
      - 'services/mcp-server/src/remote.ts'
      - 'services/mcp-server/src/remote-cli.ts'
      - 'services/mcp-server/src/remote-tools.ts'
      - 'services/mcp-server/tests/remote.test.ts'
      - 'services/mcp-server/tests/remote-tools.test.ts'
      - '.github/workflows/phase8b-format-debug.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 8B files
        run: >-
          pnpm exec prettier --write
          services/mcp-server/src/remote.ts
          services/mcp-server/src/remote-cli.ts
          services/mcp-server/src/remote-tools.ts
          services/mcp-server/tests/remote.test.ts
          services/mcp-server/tests/remote-tools.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: phase8b-formatted-files
          path: |
            services/mcp-server/src/remote.ts
            services/mcp-server/src/remote-cli.ts
            services/mcp-server/src/remote-tools.ts
            services/mcp-server/tests/remote.test.ts
            services/mcp-server/tests/remote-tools.test.ts
          retention-days: 1
