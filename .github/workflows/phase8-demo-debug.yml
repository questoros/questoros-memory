name: Phase 8 demo diagnostics

on:
  pull_request:
    paths:
      - 'services/mcp-server/scripts/phase8-demo.ts'
      - '.github/workflows/phase8-demo-debug.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @questoros-memory/database prisma:generate
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec prettier --check services/mcp-server/scripts/phase8-demo.ts > phase8-prettier.txt 2>&1
          echo $? > phase8-prettier-exit.txt
          pnpm exec eslint services/mcp-server/scripts/phase8-demo.ts --max-warnings=0 > phase8-eslint.txt 2>&1
          echo $? > phase8-eslint-exit.txt
          pnpm --filter @questoros-memory/mcp-server typecheck > phase8-typecheck.txt 2>&1
          echo $? > phase8-typecheck-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-demo-diagnostics
          path: |
            phase8-prettier.txt
            phase8-prettier-exit.txt
            phase8-eslint.txt
            phase8-eslint-exit.txt
            phase8-typecheck.txt
            phase8-typecheck-exit.txt
          if-no-files-found: error
          retention-days: 1
