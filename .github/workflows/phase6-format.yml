name: Phase 6 one-time format

on:
  push:
    branches:
      - feat/phase-6-aws-memory-api-runtime
    paths:
      - '.github/workflows/phase6-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/phase-6-aws-memory-api-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 6 files
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            .github/workflows/phase6-format.yml \
            .gitignore \
            infra/aws-cdk/README.md \
            infra/aws-cdk/package.json \
            infra/aws-cdk/src/app.ts \
            infra/aws-cdk/scripts/copy-prisma-runtime.mjs \
            infra/aws-cdk/scripts/prepare-prisma-runtime.mjs \
            infra/aws-cdk/scripts/synth.mjs \
            infra/aws-cdk/scripts/verify-assembly.mjs \
            services/memory-api/src/index.ts \
            services/memory-api/src/lambda.ts \
            services/memory-api/tests/lambda.test.ts

      - name: Commit formatting
        run: |
          git config user.name "questoros-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/phase6-format.yml .gitignore infra/aws-cdk services/memory-api/src services/memory-api/tests/lambda.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(phase6): format AWS runtime changes"
            git push origin HEAD:feat/phase-6-aws-memory-api-runtime
          fi
