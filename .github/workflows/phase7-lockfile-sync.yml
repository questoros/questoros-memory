name: Phase 7 lockfile sync

on:
  push:
    branches:
      - feat/phase-7-live-bedrock-reasoning

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase-7-live-bedrock-reasoning

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(reasoning): synchronize Phase 7 lockfile"
          git push origin HEAD:feat/phase-7-live-bedrock-reasoning
