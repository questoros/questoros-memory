name: Phase 7 format helper

on:
  pull_request:
    paths:
      - 'infra/aws-cdk/scripts/phase7-governed-harvest-smoke.mjs'
      - '.github/workflows/phase7-format-helper.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format smoke script
        run: pnpm exec prettier --write infra/aws-cdk/scripts/phase7-governed-harvest-smoke.mjs

      - name: Upload formatted script
        uses: actions/upload-artifact@v4
        with:
          name: phase7-formatted-smoke
          path: infra/aws-cdk/scripts/phase7-governed-harvest-smoke.mjs
          if-no-files-found: error
          retention-days: 1
