name: Phase 6 final one-time format

on:
  push:
    branches:
      - feat/phase-6-aws-memory-api-runtime
    paths:
      - '.github/workflows/phase6-format-latest.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase-6-aws-memory-api-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format final Phase 6 files
        run: |
          pnpm exec prettier --write \
            docs/phase-6-aws-cost-and-teardown.md \
            infra/aws-cdk/README.md \
            infra/aws-cdk/package.json \
            infra/aws-cdk/src/app.ts \
            infra/aws-cdk/scripts/staging-smoke.mjs \
            infra/aws-cdk/scripts/verify-assembly.mjs

      - name: Commit formatted files
        run: |
          git config user.name "questoros-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/phase-6-aws-cost-and-teardown.md infra/aws-cdk
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(phase6): format final AWS staging files"
            git push origin HEAD:feat/phase-6-aws-memory-api-runtime
          fi
