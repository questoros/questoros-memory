name: Phase 8 demo format fix

on:
  pull_request:
    paths:
      - 'services/mcp-server/scripts/phase8-demo.ts'
      - 'services/mcp-server/package.json'
      - 'docs/phase-8-remote-mcp-demo.md'
      - '.github/workflows/phase8-demo-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 431c987de102bce12bf2538b2882cd6a65459a8e
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 8 demo files
        run: |
          pnpm exec prettier --write \
            services/mcp-server/scripts/phase8-demo.ts \
            services/mcp-server/package.json \
            docs/phase-8-remote-mcp-demo.md
      - name: Publish exact formatter commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mcp-server/scripts/phase8-demo.ts services/mcp-server/package.json docs/phase-8-remote-mcp-demo.md
          git commit -m 'fix(phase8): format reproducible demo harness'
          git push --force origin HEAD:refs/heads/automation/phase8-demo-format
