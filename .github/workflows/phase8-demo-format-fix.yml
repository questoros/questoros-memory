name: Phase 8 demo format artifact

on:
  pull_request:
    paths:
      - 'services/mcp-server/scripts/phase8-demo.ts'
      - 'services/mcp-server/package.json'
      - 'docs/phase-8-remote-mcp-demo.md'
      - '.github/workflows/phase8-demo-format-fix.yml'

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 8 demo files
        run: |
          pnpm exec prettier --write \
            services/mcp-server/scripts/phase8-demo.ts \
            services/mcp-server/package.json \
            docs/phase-8-remote-mcp-demo.md
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase8-demo-formatted
          path: |
            services/mcp-server/scripts/phase8-demo.ts
            services/mcp-server/package.json
            docs/phase-8-remote-mcp-demo.md
          if-no-files-found: error
          retention-days: 1
