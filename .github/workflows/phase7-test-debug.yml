name: Phase 7 test debug

on:
  pull_request:
    paths:
      - 'packages/memory-core/src/errors.ts'
      - 'packages/memory-service/src/transport.ts'
      - 'packages/reasoning-provider/src/bedrock-nova-micro.ts'
      - 'packages/reasoning-provider/tests/bedrock-nova-micro.test.ts'
      - '.github/workflows/phase7-test-debug.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @questoros-memory/database prisma:generate

      - name: Capture test output
        shell: bash
        run: |
          set +e
          pnpm test > phase7-test-output.txt 2>&1
          status=$?
          echo "$status" > phase7-test-exit-code.txt
          exit 0

      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: phase7-test-debug
          path: |
            phase7-test-output.txt
            phase7-test-exit-code.txt
          if-no-files-found: error
          retention-days: 1
