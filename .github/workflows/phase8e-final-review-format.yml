name: Phase 8E final review format

on:
  push:
    branches:
      - feat/phase-8-remote-mcp-demo
    paths:
      - 'docs/final-submission-review.md'
      - '.github/workflows/phase8e-final-review-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phase-8-remote-mcp-demo
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/final-submission-review.md
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/final-submission-review.md
          git commit -m 'fix(phase8): format final evidence review'
          git push origin HEAD:feat/phase-8-remote-mcp-demo
