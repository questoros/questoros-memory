name: Phase 8E format artifact

on:
  pull_request:
    paths:
      - 'README.md'
      - '.env.example'
      - 'docs/architecture.md'
      - 'docs/cost-and-cleanup.md'
      - 'docs/development.md'
      - 'docs/devpost-submission.md'
      - 'docs/judge-guide.md'
      - 'docs/mcp-server.md'
      - 'docs/phase-8-remote-mcp-demo.md'
      - 'docs/pre-existing-work.md'
      - 'docs/video-script.md'
      - 'services/mcp-server/package.json'
      - 'services/mcp-server/scripts/phase8-judge-fixture.ts'
      - '.github/workflows/phase8e-format-artifact.yml'

permissions:
  contents: read

jobs:
  diagnose-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Capture formatter diagnostics
        continue-on-error: true
        run: pnpm exec prettier --check services/mcp-server/scripts/phase8-judge-fixture.ts 2>&1 | tee phase8e-prettier.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase8e-format-diagnostics
          path: phase8e-prettier.txt
          if-no-files-found: error
          retention-days: 1
