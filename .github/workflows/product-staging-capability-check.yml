name: Product Staging Capability Check

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    if: github.head_ref == 'feat/memoryos-finished-product'
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configured deploy capabilities
        shell: bash
        run: |
          : > deploy-capabilities.txt
          for name in \
            AWS_ROLE_ARN \
            AWS_DEPLOY_ROLE_ARN \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_ACCOUNT_ID \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_TEAM_ID \
            VERCEL_PROJECT_ID
          do
            if [ -n "${!name}" ]; then
              printf '%s=present\n' "$name" >> deploy-capabilities.txt
            else
              printf '%s=absent\n' "$name" >> deploy-capabilities.txt
            fi
          done

      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: product-staging-capabilities
          path: deploy-capabilities.txt
          if-no-files-found: error
          retention-days: 1
