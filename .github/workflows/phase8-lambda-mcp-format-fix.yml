name: Phase 8 Lambda MCP format fix

on:
  push:
    branches:
      - feat/phase-8-remote-mcp-demo
    paths:
      - 'services/mcp-server/src/remote.ts'
      - 'services/mcp-server/src/index.ts'
      - 'services/mcp-server/tests/remote.test.ts'
      - 'services/memory-api/src/lambda.ts'
      - 'services/memory-api/tests/lambda.test.ts'
      - '.github/workflows/phase8-lambda-mcp-format-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phase-8-remote-mcp-demo
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            services/mcp-server/src/remote.ts \
            services/mcp-server/src/index.ts \
            services/mcp-server/tests/remote.test.ts \
            services/memory-api/src/lambda.ts \
            services/memory-api/tests/lambda.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mcp-server/src/remote.ts services/mcp-server/src/index.ts services/mcp-server/tests/remote.test.ts services/memory-api/src/lambda.ts services/memory-api/tests/lambda.test.ts
          git commit -m 'fix(phase8): format Lambda MCP adapter'
          git push origin HEAD:feat/phase-8-remote-mcp-demo
