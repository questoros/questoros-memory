name: Phase 8 staging integration sync

on:
  push:
    branches:
      - feat/phase-8-remote-mcp-demo
    paths:
      - 'services/mcp-server/src/remote.ts'
      - 'services/memory-api/package.json'
      - 'services/memory-api/src/app.ts'
      - 'services/memory-api/src/remote-mcp.ts'
      - 'services/memory-api/tests/remote-mcp-route.test.ts'
      - 'infra/aws-cdk/src/app.ts'
      - 'infra/aws-cdk/scripts/verify-assembly.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/phase8-staging-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/phase-8-remote-mcp-demo
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - name: Update lockfile and formatting
        run: |
          pnpm install --lockfile-only
          pnpm exec prettier --write \
            services/mcp-server/src/remote.ts \
            services/memory-api/package.json \
            services/memory-api/src/app.ts \
            services/memory-api/src/remote-mcp.ts \
            services/memory-api/tests/remote-mcp-route.test.ts \
            infra/aws-cdk/src/app.ts \
            infra/aws-cdk/scripts/verify-assembly.mjs
      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml services/mcp-server/src/remote.ts services/memory-api/package.json services/memory-api/src/app.ts services/memory-api/src/remote-mcp.ts services/memory-api/tests/remote-mcp-route.test.ts infra/aws-cdk/src/app.ts infra/aws-cdk/scripts/verify-assembly.mjs
          git commit -m 'chore(phase8): synchronize staging integration files'
          git push origin HEAD:feat/phase-8-remote-mcp-demo
